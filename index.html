<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopSteward | Dashboard</title>
    
    <!-- Safe CDNs for Styling and Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0d1117;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            overflow-x: hidden;
            height: 100vh;
        }

        /* Aurora Glowing Blobs */
        .aurora-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.5;
            animation: float 12s infinite ease-in-out alternate;
        }
        .blob-purple { top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, #8b5cf6 0%, transparent 70%); }
        .blob-teal { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: radial-gradient(circle, #14b8a6 0%, transparent 70%); animation-delay: -5s; }
        .blob-pink { top: 40%; left: 40%; width: 40vw; height: 40vw; background: radial-gradient(circle, #ec4899 0%, transparent 70%); opacity: 0.3; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 5%) scale(1.1); }
        }

        /* Glassmorphism Utility */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.15);
            transition: border-color 0.3s ease;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body class="flex">

    <!-- 🌌 Aurora Background Elements -->
    <div class="aurora-blob blob-purple"></div>
    <div class="aurora-blob blob-teal"></div>
    <div class="aurora-blob blob-pink"></div>

    <!-- 🧭 Left Sidebar (Glass Pill) -->
    <aside class="fixed left-6 top-1/2 -translate-y-1/2 z-50">
        <nav class="glass-panel flex flex-col gap-4 p-3 rounded-full">
            <div class="w-12 h-12 flex items-center justify-center bg-white/10 rounded-full mb-4 cursor-pointer hover:bg-white/20 transition">
                <span class="text-xl font-bold">SS</span>
            </div>
            <!-- Dashboard (Active) -->
            <button class="w-12 h-12 flex items-center justify-center bg-indigo-500 rounded-full text-white shadow-[0_0_15px_rgba(99,102,241,0.5)] transition-transform hover:scale-110">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            </button>
            <!-- Invoices -->
            <button class="w-12 h-12 flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10 rounded-full transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            </button>
            <!-- Expenses -->
            <button class="w-12 h-12 flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10 rounded-full transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </button>
            <!-- Settings -->
            <button class="w-12 h-12 flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10 rounded-full transition-all mt-4">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
        </nav>
    </aside>

    <!-- 📊 Main Content Area -->
    <main class="flex-1 ml-28 p-8 lg:p-10 max-w-[1600px] mx-auto h-screen overflow-y-auto">
        
        <!-- 🔝 Top Header -->
        <header class="flex justify-between items-center mb-10">
            <div class="glass-panel flex items-center px-4 py-3 rounded-2xl w-96">
                <svg class="w-5 h-5 text-gray-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" placeholder="Search invoices, clients..." class="bg-transparent border-none outline-none text-sm text-white placeholder-gray-400 w-full">
                <span class="text-xs text-gray-500 bg-white/10 px-2 py-1 rounded-md">⌘K</span>
            </div>

            <div class="flex items-center gap-4">
                <button class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-2xl font-medium text-sm transition-all shadow-[0_0_20px_rgba(79,70,229,0.4)]">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Create Invoice
                </button>
                <button class="glass-panel w-12 h-12 flex items-center justify-center rounded-2xl text-gray-300 hover:text-white transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                </button>
                <div class="glass-panel p-1 pr-4 rounded-2xl flex items-center gap-3 cursor-pointer">
                    <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-500 rounded-xl flex items-center justify-center">
                        <span class="text-white font-bold">O</span>
                    </div>
                    <div>
                        <p class="text-sm font-semibold">ShopSteward</p>
                        <p class="text-xs text-gray-400">Owner</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- 👋 Welcome -->
        <div class="mb-8">
            <h1 class="text-3xl font-bold font-['Plus_Jakarta_Sans']">Welcome Back, Owner!</h1>
            <p class="text-gray-400 mt-1 text-sm">Here is your business overview for this month.</p>
        </div>

        <!-- 🍱 EMPTY BENTO GRID CONTAINER -->
        <!-- Block 2 will be inserted inside this div -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <div class="glass-panel rounded-3xl p-6 h-64 flex items-center justify-center border-dashed border-2 border-white/10 md:col-span-1">
                <p class="text-gray-500">Card 1: Total Revenue (Block 2)</p>
            </div>
            
            <div class="glass-panel rounded-3xl p-6 h-64 flex items-center justify-center border-dashed border-2 border-white/10 md:col-span-2">
                <p class="text-gray-500">Card 2: Revenue Chart (Block 2)</p>
            </div>

        </div>
    </main>

</body>
</html>
